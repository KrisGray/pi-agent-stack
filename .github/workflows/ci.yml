name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deps before pytest: tests/test_manifest.py resolves pi.extensions
      # entries under node_modules/ — the same tree every real consumer
      # has after pi installs this package.
      - name: Install dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v5

      - name: Test suite
        run: uv run --with pytest pytest -q tests/

      - name: Tarball integrity
        run: npm pack --dry-run
